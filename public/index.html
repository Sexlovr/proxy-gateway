<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b14" />
  <title>⚡ Proxy Gateway</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/aurora.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <!-- Aurora mesh background -->
  <div class="aurora" aria-hidden="true">
    <div class="blob-a"></div>
    <div class="blob-b"></div>
    <div class="blob-c"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Proxy&nbsp;<span class="accent">Gateway</span></span>
      </div>

      <button type="button" class="spotlight-trigger" id="spotlight-trigger" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span style="flex:1;text-align:left">Search providers, models, actions…</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div class="spacer"></div>

      <div class="theme-toggle" id="theme-toggle" data-active="dark" role="group" aria-label="Theme switch">
        <div class="pill" aria-hidden="true"></div>
        <button type="button" class="seg" data-theme-val="dark" aria-label="Dark">☾</button>
        <button type="button" class="seg" data-theme-val="light" aria-label="Light">☀</button>
        <button type="button" class="seg" data-theme-val="cyber" aria-label="Cyber">⎈</button>
      </div>

      <a class="github-link" href="https://github.com/Sexlovr/proxy-gateway" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.92.58.11.79-.25.79-.55v-1.93c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.11-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.2-3.1-.12-.3-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.92-.39 2.91-.39s1.99.13 2.91.39c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.75.11 3.05.74.81 1.2 1.84 1.2 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.66.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
      </a>
    </header>

    <!-- Sidebar nav -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-group">
        <div class="nav-label">Manage</div>
        <a class="nav-item" data-page="add">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span class="label">Add Provider</span>
        </a>
        <a class="nav-item" data-page="providers">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span class="label">Providers</span>
        </a>
        <a class="nav-item" data-page="models">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><line x1="9" y1="9" x2="11" y2="11"/><line x1="15" y1="9" x2="13" y2="11"/><line x1="9" y1="15" x2="11" y2="13"/><line x1="15" y1="15" x2="13" y2="13"/></svg>
          <span class="label">Models</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Build & Test</div>
        <a class="nav-item" data-page="sandbox">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span class="label">Sandbox</span>
        </a>
        <a class="nav-item" data-page="help">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
          <span class="label">Help</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Monitor</div>
        <a class="nav-item" data-page="dashboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
          <span class="label">Dashboard</span>
          <span class="live" aria-label="live" data-live-indicator hidden></span>
        </a>
      </div>

      <div class="footer">
        <span>Universal Sandbox · <a href="https://github.com/Sexlovr/sandbox-code-proxy-gate" target="_blank" rel="noopener">↗ code samples</a></span>
        <span>OpenAI-compatible</span>
      </div>
    </nav>

    <!-- Main content -->
    <main class="app-main">
      <div class="page" id="page-root" aria-live="polite"></div>
    </main>
  </div>

  <!-- Toast & Modal containers -->
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div id="modal-root" aria-hidden="true"></div>
  <div class="spotlight" id="spotlight-root" aria-hidden="true"></div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
